<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar el Menor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { margin: 10px; padding: 10px; width: 80px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 25px; cursor: pointer; background-color: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #c82333; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <h2>¿Cuál es el número menor?</h2>
        
        <input type="number" id="num1" placeholder="Nº 1">
        <input type="number" id="num2" placeholder="Nº 2">
        <input type="number" id="num3" placeholder="Nº 3">
        
        <br><br>
        <button onclick="encontrarMenor()">Calcular Menor</button>

        <div id="resultado"></div>
    </div>

    <script>
        function encontrarMenor() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const display = document.getElementById('resultado');

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                display.innerText = "Escribe los tres números primero.";
                display.style.color = "orange";
                return;
            }

            const menor = Math.min(n1, n2, n3);

            display.style.color = "#dc3545";
            display.innerText = "El número menor es: " + menor;
        }
    </script>

</body>
