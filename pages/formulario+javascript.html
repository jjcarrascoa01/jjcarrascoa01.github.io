<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Moderno</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Poppins',sans-serif;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:30px;
        background:
        linear-gradient(135deg, rgba(15,23,42,.92), rgba(37,99,235,.75)),
        url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1600&auto=format&fit=crop') center/cover;
    }

    .formulario-container{
        width:100%;
        max-width:560px;
        background:rgba(255,255,255,0.12);
        backdrop-filter:blur(14px);
        border:1px solid rgba(255,255,255,0.15);
        border-radius:24px;
        padding:40px;
        box-shadow:0 15px 40px rgba(0,0,0,.35);
        color:white;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        font-size:2rem;
        font-weight:700;
    }

    .subtitulo{
        text-align:center;
        margin-bottom:30px;
        opacity:.8;
        font-size:.95rem;
    }

    .form-group{
        margin-bottom:22px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-size:.95rem;
        font-weight:500;
    }

    input,
    select,
    textarea{
        width:100%;
        padding:14px 16px;
        border:none;
        border-radius:14px;
        background:rgba(255,255,255,0.15);
        color:white;
        font-size:15px;
        outline:none;
        transition:.3s;
    }

    input::placeholder,
    textarea::placeholder{
        color:rgba(255,255,255,.65);
    }

    input:focus,
    select:focus,
    textarea:focus{
        background:rgba(255,255,255,0.22);
        box-shadow:0 0 0 3px rgba(96,165,250,.35);
    }

    select option{
        color:black;
    }

    textarea{
        resize:none;
    }

    .checkbox-group{
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }

    .checkbox-item{
        display:flex;
        align-items:center;
        gap:10px;
        background:rgba(255,255,255,0.12);
        border:1px solid rgba(255,255,255,0.12);
        padding:14px;
        border-radius:14px;
        transition:.3s;
        cursor:pointer;
    }

    .checkbox-item:hover{
        transform:translateY(-2px);
        background:rgba(255,255,255,0.18);
    }

    input[type="checkbox"]{
        width:18px;
        height:18px;
        accent-color:#60a5fa;
    }

    .button-group{
        display:flex;
        gap:14px;
        margin-top:30px;
    }

    button{
        flex:1;
        padding:14px;
        border:none;
        border-radius:14px;
        cursor:pointer;
        font-size:15px;
        font-weight:600;
        transition:.3s;
    }

    .btn-submit{
        background:linear-gradient(135deg,#3b82f6,#2563eb);
        color:white;
    }

    .btn-submit:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 20px rgba(37,99,235,.35);
    }

    .btn-reset{
        background:rgba(255,255,255,.15);
        color:white;
    }

    .btn-reset:hover{
        background:rgba(255,255,255,.25);
    }

    .success-message{
        display:none;
        margin-bottom:20px;
        padding:14px;
        border-radius:12px;
        background:#16a34a;
        text-align:center;
        font-weight:500;
    }

    @media(max-width:600px){

        .formulario-container{
            padding:28px;
        }

        .checkbox-group{
            grid-template-columns:1fr;
        }

        .button-group{
            flex-direction:column;
        }
    }
</style>
</head>

<body>

<div class="formulario-container">

    <h1>Formulario de Registro</h1>
    <p class="subtitulo">Completa la información solicitada</p>

    <div class="success-message" id="successMessage">
        ✅ Formulario enviado correctamente
    </div>

    <form id="miFormulario">

        <div class="form-group">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre" required>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido *</label>
            <input type="text" id="apellido" name="apellido" placeholder="Introduce tu apellido" required>
        </div>

        <div class="form-group">
            <label for="id">ID *</label>
            <input type="text" id="id" name="id" placeholder="Ej: 12345" required>
        </div>

        <div class="form-group">
            <label for="edad">Edad *</label>
            <input type="number" id="edad" name="edad" min="1" max="120" required>
        </div>

        <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento *</label>
            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
        </div>

        <div class="form-group">
            <label for="pais">País *</label>

            <select id="pais" name="pais" required>
                <option value="" disabled selected>Selecciona un país</option>
                <option value="España">España</option>
                <option value="México">México</option>
                <option value="Argentina">Argentina</option>
                <option value="Colombia">Colombia</option>
                <option value="Chile">Chile</option>
                <option value="Perú">Perú</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="form-group">
            <label>Actividades</label>

            <div class="checkbox-group">

                <label class="checkbox-item">
                    <input type="checkbox" name="actividades" value="Deporte">
                    Deporte
                </label>

                <label class="checkbox-item">
                    <input type="checkbox" name="actividades" value="Música">
                    Música
                </label>

                <label class="checkbox-item">
                    <input type="checkbox" name="actividades" value="Arte">
                    Arte
                </label>

                <label class="checkbox-item">
                    <input type="checkbox" name="actividades" value="Lectura">
                    Lectura
                </label>

            </div>
        </div>

        <div class="form-group">
            <label for="comentarios">Comentarios</label>

            <textarea
                id="comentarios"
                name="comentarios"
                rows="5"
                placeholder="Escribe aquí tus comentarios..."
            ></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit">Enviar</button>
            <button type="reset" class="btn-reset">Limpiar</button>
        </div>

    </form>

</div>

<script>

document.getElementById('miFormulario').addEventListener('submit', function(e){

    e.preventDefault();

    const datos = {

        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        id: document.getElementById('id').value,
        edad: document.getElementById('edad').value,
        fechaNacimiento: document.getElementById('fechaNacimiento').value,
        pais: document.getElementById('pais').value,

        actividades: Array.from(
            document.querySelectorAll('input[name="actividades"]:checked')
        ).map(input => input.value),

        comentarios: document.getElementById('comentarios').value
    };

    console.log(datos);

    const successMessage = document.getElementById('successMessage');

    successMessage.style.display = 'block';

    setTimeout(() => {
        successMessage.style.display = 'none';
    },3000);

    this.reset();
});

</script>

</body>
</html>
