<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar el Mayor</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        input { margin: 5px; padding: 8px; width: 60px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 4px; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #28a745; }
    </style>
</head>
<body>

    <h2>¿Cuál es el número mayor?</h2>
    
    <div>
        <input type="number" id="num1" placeholder="Nº 1">
        <input type="number" id="num2" placeholder="Nº 2">
        <input type="number" id="num3" placeholder="Nº 3">
    </div>
    
    <br>
    <button onclick="compararNumeros()">Calcular Mayor</button>

    <div id="resultado"></div>

    <script>
        function compararNumeros() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const n3 = parseFloat(document.getElementById('num3').value);
            const display = document.getElementById('resultado');

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                display.innerText = "Por favor, introduce los tres números.";
                display.style.color = "red";
                return;
            }

            const mayor = Math.max(n1, n2, n3);

            display.style.color = "#28a745";
            display.innerText = "El número mayor es: " + mayor;
        }
    </script>

</body>
</html>
